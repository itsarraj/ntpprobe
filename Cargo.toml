[package]
name = "ntpprobe"
version = "0.1.0"
edition = "2021"
description = "Microsecond NTP/SNTP clock drift, stratum hierarchy, and jitter auditor"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/ntpprobe"
readme = "README.md"
keywords = ["ntp", "sntp", "clock-drift", "networking", "telemetry"]
categories = ["command-line-utilities", "network-programming", "development-tools"]

[lib]
name = "ntpprobe"
path = "src/lib.rs"

[[bin]]
name = "ntpprobe"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
